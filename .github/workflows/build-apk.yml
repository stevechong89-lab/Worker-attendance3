name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/example/workerattendance
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WorkerAttendance"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.workerattendance'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.workerattendance'
                  minSdk 24
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>

              <application
                  android:allowBackup="true"
                  android:label="工友打卡"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1976D2</item>
                  <item name="android:statusBarColor">#1976D2</item>
                  <item name="android:navigationBarColor">#000000</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/java/com/example/workerattendance/MainActivity.java <<'EOF'
          package com.example.workerattendance;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.google.zxing.integration.android.IntentIntegrator;
          import com.google.zxing.integration.android.IntentResult;

          public class MainActivity extends Activity {

              private LinearLayout root;

              private int workerState = 0;

              private String stateText() {
                  switch (workerState) {
                      case 0:
                          return "未上班";
                      case 1:
                          return "已上班";
                      case 2:
                          return "午休中";
                      case 3:
                          return "午休回来";
                      case 4:
                          return "已下班";
                      default:
                          return "未知";
                  }
              }

              private String nextAction() {
                  switch (workerState) {
                      case 0:
                          return "上班";
                      case 1:
                          return "午休出去";
                      case 2:
                          return "午休回来";
                      case 3:
                          return "下班";
                      default:
                          return "今天已经完成打卡";
                  }
              }

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  home();
              }

              private void base(String title) {

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 24, 24, 24);
                  root.setBackgroundColor(Color.rgb(247, 249, 252));

                  TextView titleView = text(title, 24);
                  titleView.setGravity(Gravity.CENTER);
                  root.addView(titleView);

                  setContentView(root);
              }

              private TextView text(String value, float size) {

                  TextView t = new TextView(this);

                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(Color.rgb(35, 45, 60));
                  t.setPadding(16, 16, 16, 16);

                  return t;
              }

              private Button button(String title, View.OnClickListener listener) {

                  Button b = new Button(this);

                  b.setText(title);
                  b.setTextSize(16);
                  b.setOnClickListener(listener);

                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.WRAP_CONTENT);

                  p.setMargins(0, 8, 0, 8);

                  b.setLayoutParams(p);

                  return b;
              }

              private void home() {

                  base("工友打卡系统");

                  root.addView(text(
                          "Android 第一阶段测试版\n\n" +
                          "员工二维码 + 工头扫码",
                          18));

                  root.addView(button(
                          "工头：扫码打卡",
                          v -> foreman()));

                  root.addView(button(
                          "员工：我的二维码",
                          v -> employee()));

                  root.addView(button(
                          "老板：今日记录",
                          v -> admin()));
              }

              private void employee() {

                  base("员工二维码");

                  root.addView(text(
                          "员工姓名：Ali\n" +
                          "员工编号：EMP001\n\n" +
                          "把这个二维码交给工头扫描。",
                          18));

                  TextView qr = text(
                          "\n\n" +
                          "████████████\n" +
                          "██  ██  ████\n" +
                          "██ ████ ██  \n" +
                          "████  ██████\n" +
                          "██ ██ ██  ██\n" +
                          "████████████\n\n" +
                          "EMP001\n\n",
                          20);

                  qr.setGravity(Gravity.CENTER);

                  root.addView(qr);

                  root.addView(text(
                          "测试版二维码显示区域。\n" +
                          "正式版会自动生成真正 QR Code。",
                          15));

                  root.addView(button("返回", v -> home()));
              }

              private void foreman() {

                  base("工头扫码");

                  root.addView(text(
                          "工头：Ahmad\n" +
                          "工头编号：S001\n\n" +
                          "当前工地：Putra Heights\n\n" +
                          "员工当前状态：" + stateText(),
                          18));

                  root.addView(button(
                          "📷 扫描员工 QR",
                          v -> scan()));

                  root.addView(text(
                          "\n系统自动判断：\n\n" +
                          "未上班 → 上班\n\n" +
                          "已上班 → 午休出去\n\n" +
                          "午休中 → 午休回来\n\n" +
                          "午休回来 → 下班",
                          16));

                  root.addView(button("返回", v -> home()));
              }

              private void scan() {

                  if (ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              100);

                      return;
                  }

                  IntentIntegrator integrator =
                          new IntentIntegrator(this);

                  integrator.setDesiredBarcodeFormats(
                          IntentIntegrator.QR_CODE);

                  integrator.setPrompt(
                          "请把员工 QR Code 放入扫描框");

                  integrator.setBeepEnabled(true);

                  integrator.setOrientationLocked(false);

                  integrator.initiateScan();
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data);

                  IntentResult result =
                          IntentIntegrator.parseActivityResult(
                                  requestCode,
                                  resultCode,
                                  data);

                  if (result != null) {

                      if (result.getContents() != null) {
                          showScan(result.getContents());
                      } else {
                          toast("已取消扫描");
                      }
                  }
              }

              private void showScan(String code) {

                  base("扫描成功");

                  root.addView(text(
                          "二维码内容：\n" + code +
                          "\n\n员工：Ali" +
                          "\n员工编号：EMP001" +
                          "\n\n工头：Ahmad" +
                          "\n工地：Putra Heights",
                          18));

                  String action = nextAction();

                  root.addView(text(
                          "\n系统判断下一步：\n\n" +
                          action,
                          22));

                  if (workerState < 4) {

                      root.addView(button(
                              "确认：" + action,
                              v -> confirm()));

                  } else {

                      root.addView(text(
                              "今天已经完成全部打卡。",
                              18));
                  }

                  root.addView(button(
                          "取消",
                          v -> foreman()));
              }

              private void confirm() {

                  String action = nextAction();

                  workerState++;

                  toast("记录成功：" + action);

                  foreman();
              }

              private void admin() {

                  base("老板 · 今日记录");

                  root.addView(text(
                          "今日出勤\n\n" +
                          "员工：Ali\n" +
                          "工头：Ahmad\n" +
                          "工地：Putra Heights\n\n" +
                          "目前状态：" + stateText() +
                          "\n\n" +
                          "正式版将记录：\n" +
                          "• 上班时间\n" +
                          "• 午休出去\n" +
                          "• 午休回来\n" +
                          "• 下班时间\n" +
                          "• 实际工作时间\n" +
                          "• 迟到\n" +
                          "• 早退\n" +
                          "• 午休超时\n" +
                          "• 漏打卡",
                          17));

                  root.addView(button(
                          "返回",
                          v -> home()));
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults);

                  if (requestCode == 100) {

                      if (grantResults.length > 0 &&
                              grantResults[0] ==
                                      PackageManager.PERMISSION_GRANTED) {

                          scan();

                      } else {

                          toast("需要摄像头权限才能扫码");
                      }
                  }
              }

              private void toast(String message) {

                  Toast.makeText(
                          this,
                          message,
                          Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: worker-attendance-apk
          path: app/build/outputs/apk/debug/app-debug.apk
